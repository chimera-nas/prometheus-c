name: Build and perform build time tests

on:
  pull_request:        # always build for PRs but don't publish
  workflow_dispatch:   # allow manual runs

env:
  DEV_IMAGE_TAG_PREFIX: prometheus-c-dev

jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.build_type }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            build_type: Release
            tag: latest-amd64
          - platform: linux/amd64
            runner: ubuntu-24.04
            build_type: Debug
            tag: latest-debug-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            build_type: Release
            tag: latest-arm64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            build_type: Debug
            tag: latest-debug-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the dev container image
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ env.DEV_IMAGE_TAG_PREFIX }}:${{ github.sha }}-${{ matrix.tag }}
          build-args: |
            BUILD_TYPE=${{ matrix.build_type }}

      - name: Configure, build, and test inside the dev container
        run: |
          docker run --rm --privileged \
            -v "${{ github.workspace }}:/workspace" \
            -v /build \
            -w /build \
            ${{ env.DEV_IMAGE_TAG_PREFIX }}:${{ github.sha }}-${{ matrix.tag }} \
            bash -euxc '\
              cmake -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} /workspace && \
              ninja && \
              ctest -j 4 --output-on-failure'

  native:
    permissions:
      contents: read
    name: ${{ matrix.platform.name }} ${{ matrix.config }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
        platform:
          - {name: windows-x64, runner: windows-2022, arch: x64}
          - {name: windows-arm64, runner: windows-11-arm, arch: ARM64}
          - {name: macos-arm64, runner: macos-14, arch: ARM64}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A ${{ matrix.platform.arch }}
      - name: Configure Unix
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }}
      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel 4
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure --no-tests=error --timeout 60
      - name: Install
        run: cmake --install build --config ${{ matrix.config }} --prefix install
      - uses: actions/upload-artifact@v4
        with:
          name: prometheus-c-${{ matrix.platform.name }}-${{ matrix.config }}
          path: install/
